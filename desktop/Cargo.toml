[package]
name = "rightchess-desktop"
version = "0.1.0"
edition = "2024"

[dependencies]
rightchess = { path = "../core" }
anyhow = "1.0.104"
arboard = "3.7.0"
chrono = "0.4.45"
dioxus = { version = "0.7.10", features = ["desktop"] }
# Backs the vendored components in src/components; the registry points at this git source.
dioxus-primitives = { git = "https://github.com/DioxusLabs/components", default-features = false }
serde_json = { version = "1.0.151", features = ["preserve_order"] }
tokio = { version = "1", features = ["rt"] }
dirs = "7.0.0"

[dev-dependencies]
dioxus-ssr = "0.7.10"

[lints]
workspace = true
