name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install Stockfish
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          case "$RUNNER_OS" in
            Linux) asset=stockfish-linux-x86-64-universal; archive=$asset.tar.gz ;;
            macOS) asset=stockfish-macos-universal; archive=$asset.tar.gz ;;
            Windows) asset=stockfish-windows-x86-64-universal.exe; archive=stockfish-windows-x86-64-universal.zip ;;
          esac
          gh release download sf_19 --repo official-stockfish/Stockfish -p "$archive" -D "$RUNNER_TEMP"
          cd "$RUNNER_TEMP"
          case "$archive" in
            *.zip) 7z x -y "$archive" > /dev/null ;;
            *) tar xzf "$archive" ;;
          esac
          echo "STOCKFISH=$RUNNER_TEMP/stockfish/$asset" >> "$GITHUB_ENV"
      - run: cargo build -p rightchess --all-targets --locked
      - run: cargo test -p rightchess --locked

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy -p rightchess --all-targets --locked -- -D warnings

  desktop:
    name: desktop (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      # The webview stack (wry, tao, muda) links these on Linux.
      - name: Install system libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev
      - run: cargo clippy -p rightchess-desktop --all-targets --locked -- -D warnings
      - run: cargo build -p rightchess-desktop --all-targets --locked
      - run: cargo test -p rightchess-desktop --locked
